# nginx MAIN config for the CN project edge (edge1-mac2 on 10.7.15.23).
#
# Rendered by scripts/render-configs.sh. cn.sh starts nginx with
#     nginx -p /Users/krishnaverma/cn-project/nginx -c /Users/krishnaverma/cn-project/nginx/nginx.conf
# so the edge is completely self-contained in ~/cn-project: it does not use
# Homebrew's /opt/homebrew/etc/nginx/nginx.conf, does not need root, and
# cannot clash with root-owned files left over from "sudo brew services".

# Process user. On the primary edge (Krishna's Mac) nginx runs as ROOT -
# master AND workers: the workers open the upstream connections to the
# backends, and macOS Local Network privacy only exempts root processes
# (see scripts/phase2/edge-root.sh). On the standby edge nginx runs as the
# normal user (its backends are on its own IP, which is not restricted).
user root wheel;

worker_processes  1;
pid        /Users/krishnaverma/cn-project/run/nginx.pid;
error_log  /Users/krishnaverma/cn-project/logs/nginx-error.log warn;

events {
    worker_connections  256;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    # Must be set here too, otherwise nginx opens Homebrew's compiled-in default
    # (/opt/homebrew/var/log/nginx/access.log), which may be root-owned.
    access_log  /Users/krishnaverma/cn-project/logs/nginx-access.log;

    client_body_temp_path  /Users/krishnaverma/cn-project/run/nginx-tmp/client_body;
    proxy_temp_path        /Users/krishnaverma/cn-project/run/nginx-tmp/proxy;
    fastcgi_temp_path      /Users/krishnaverma/cn-project/run/nginx-tmp/fastcgi;
    uwsgi_temp_path        /Users/krishnaverma/cn-project/run/nginx-tmp/uwsgi;
    scgi_temp_path         /Users/krishnaverma/cn-project/run/nginx-tmp/scgi;

    # The project site: upstreams, TLS, load balancing (nginx.conf.template)
    include  /Users/krishnaverma/cn-project/nginx/cn-project.conf;
}
