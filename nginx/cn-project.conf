# Ready-to-use nginx config for Mac 2 (10.7.15.125)
# Install to: /opt/homebrew/etc/nginx/servers/cn-project.conf
#
# Mac 3 (backends) = 10.7.12.174

upstream backend_pool {
    server 10.7.12.174:3001 max_fails=2 fail_timeout=10s;   # Backend A
    server 10.7.12.174:3002 max_fails=2 fail_timeout=10s;   # Backend B
    # default strategy is round-robin; for least-connections instead:
    # least_conn;
}

# Plain HTTP (used by scripts/smoke-test.sh)
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /Users/krishnaverma/cn-tls/app.teamX.test+2.pem;
    ssl_certificate_key /Users/krishnaverma/cn-tls/app.teamX.test+2-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
